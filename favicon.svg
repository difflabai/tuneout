<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Shield shape -->
  <path d="M256 72 L400 140 L400 280 C400 370 330 440 256 468 C182 440 112 370 112 280 L112 140 Z"
        fill="url(#shield)" opacity="0.9"/>
  <!-- T letterform - white -->
  <rect x="176" y="180" width="160" height="36" rx="4" fill="#ffffff"/>
  <rect x="236" y="180" width="40" height="200" rx="4" fill="#ffffff"/>
  <!-- Slash/filter line across the T -->
  <line x1="160" y1="400" x2="352" y2="160" stroke="#ff6b6b" stroke-width="28" stroke-linecap="round" opacity="0.85"/>
</svg>
